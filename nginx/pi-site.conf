# Nginx configuration for pi-site
# Install together with nginx.conf using ./scripts/install-nginx.sh.
# The installer verifies the running listener and restores configuration on failure.

# Umami analytics dashboard subdomain
server {
    listen 127.0.0.1:80;
    server_name umami.rioedwards.com;
    limit_req zone=dogtown_requests burst=60 nodelay;
    limit_conn per_client 20;
    if ($redirect_tunnel_http) { return 301 https://$host$request_uri; }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Preserve original host/IP info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache_bypass $http_upgrade;
    }
}

# Main site - default server for all other requests
server {
    listen 127.0.0.1:80 default_server;
    server_name _;
    limit_req zone=dogtown_requests burst=60 nodelay;
    limit_conn per_client 20;
    if ($redirect_tunnel_http) { return 301 https://$host$request_uri; }

    # The application verifies raster signatures and rejects symlinks and active content.
    location /api/assets/images/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Next.js image optimization - cache at nginx level
    # Images are optimized once by Node.js, then served from nginx cache
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Cache optimized images for 30 days
        proxy_cache nextjs_images;
        proxy_cache_valid 200 30d;
        proxy_cache_key $uri$is_args$args;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/stats {
        limit_conn per_client 2;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 70s;
        proxy_buffering off;
    }

    # Proxy all other requests to Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Preserve original host/IP info (use Cloudflare's real client IP)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache_bypass $http_upgrade;

        # Disable buffering for streaming (SSE for /stats page)
        proxy_read_timeout 70s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
    }
}
