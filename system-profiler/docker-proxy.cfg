# HAProxy method/path ACLs follow Tecnativa/docker-socket-proxy, narrowed to metrics.
# Container inspect, archive, logs, exec and all write methods are denied.
global
    maxconn 32

defaults
    mode http
    timeout connect 2s
    timeout client 15s
    timeout server 15s

frontend metrics
    bind :2375
    acl read_method method GET
    acl list_path path -m str /containers/json
    acl stats_path path_reg ^/containers/[a-f0-9]{64}/stats$
    http-request deny unless read_method
    http-request deny unless list_path or stats_path
    http-request set-query all=true&filters=%%7B%%22label%%22%%3A%%5B%%22com.rioredwards.stack%%3Dpi-site%%22%%5D%%7D if list_path
    http-request set-query stream=false if stats_path
    default_backend docker

backend docker
    server socket /var/run/docker.sock
