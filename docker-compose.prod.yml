# Production configuration
# Usage: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  web:
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /app/.next/cache:uid=1001,gid=1001,size=128m,noexec,nosuid
    volumes:
      - uploads_data:/data/uploads/images
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 768M
        reservations:
          cpus: "0.5"
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  system-profiler:
    volumes:
      - /proc/stat:/host/proc/stat:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/loadavg:/host/proc/loadavg:ro
      - /proc/uptime:/host/proc/uptime:ro
      - /proc/cpuinfo:/host/proc/cpuinfo:ro
      - /proc/version:/host/proc/version:ro
      - /proc/net/dev:/host/proc/net/dev:ro
      - /sys/class/thermal/thermal_zone0/temp:/host/sys/class/thermal/thermal_zone0/temp:ro
      # statfs on a harmless regular file reports root capacity without directory access.
      - /etc/hostname:/host/disk:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8787"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ai-img-validator:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 384M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  umami:
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      APP_SECRET: ${UMAMI_APP_SECRET:?Analytics secret required}
      TZ: America/Los_Angeles
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    name: pi_site_prod_data
  uploads_data:
    name: pi_site_prod_uploads
